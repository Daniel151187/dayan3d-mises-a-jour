<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Votre devis</title>
<style>
  :root { --red:#e11d2e; --ink:#17171a; --muted:#6b6b76; --line:#e6e6ea; --bg:#f4f4f6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  .band { background:#0b0b0c; color:#fff; border-bottom:5px solid var(--red); border-radius:14px 14px 0 0; padding:22px 24px; }
  .band small { color:var(--red); font-weight:700; letter-spacing:.25em; font-size:12px; }
  .band h1 { margin:4px 0 2px; font-size:28px; }
  .band .d { color:#b9b9c2; font-size:14px; }
  .card { background:#fff; border:1px solid var(--line); border-top:0; border-radius:0 0 14px 14px; padding:22px 24px; }
  h2 { font-size:15px; margin:0 0 8px; }
  .meta { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px; }
  .meta div { font-size:14px; color:var(--muted); }
  .meta b { color:var(--ink); display:block; font-size:15px; }
  table { width:100%; border-collapse:collapse; margin:10px 0; font-size:14px; }
  th { text-align:left; background:#0b0b0c; color:#fff; padding:8px 10px; font-weight:500; font-size:13px; }
  th.n, td.n { text-align:right; white-space:nowrap; }
  td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .tot { margin-top:12px; display:flex; flex-direction:column; align-items:flex-end; gap:4px; font-size:14px; color:var(--muted); }
  .tot .grand { background:#0b0b0c; color:#fff; border-left:5px solid var(--red); border-radius:8px; padding:10px 16px; font-size:18px; min-width:230px; display:flex; justify-content:space-between; gap:20px; margin-top:6px; }
  .notes { margin-top:14px; font-size:14px; color:#333; white-space:pre-wrap; }
  .act { margin-top:22px; border-top:1px solid var(--line); padding-top:18px; }
  label { display:block; font-size:14px; color:var(--muted); margin-bottom:4px; }
  input { width:100%; padding:11px 12px; font:inherit; border:1px solid #cfcfd6; border-radius:10px; }
  .btns { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:13px 22px; cursor:pointer; }
  .ok { background:var(--red); color:#fff; }
  .no { background:#fff; color:var(--ink); border:1px solid #cfcfd6; }
  button[disabled] { opacity:.6; cursor:default; }
  .msg { border-radius:12px; padding:16px 18px; margin-bottom:16px; font-size:15px; }
  .good { background:#ecfdf3; border:1px solid #a6e9c2; color:#14532d; }
  .warn { background:#fff7e6; border:1px solid #f3d38a; color:#7a4b08; }
  .bad { background:#fef2f2; border:1px solid #f5b5b5; color:#7f1d1d; }
  .foot { margin-top:18px; text-align:center; color:var(--muted); font-size:13px; }
  @media (max-width:560px){ .meta{grid-template-columns:1fr;} .band h1{font-size:23px;} }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg warn">Chargement de votre devis…</div></div>
<script>
const API = 'https://uczoufwtgqnvhqavbngi.supabase.co/functions/v1/quote-public';
const token = new URLSearchParams(location.search).get('t') || '';
const $app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const nf = new Intl.NumberFormat('fr-CH', { style: 'currency', currency: 'CHF' });
const chf = (n) => nf.format(Number(n || 0));
const fmt = (iso) => (iso ? new Date(String(iso).slice(0, 10) + 'T12:00:00').toLocaleDateString('fr-CH', { day: 'numeric', month: 'long', year: 'numeric' }) : '');

async function call(action, name) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, action, name }) });
  let j = {}; try { j = await r.json(); } catch {}
  return { status: r.status, data: j };
}

function render(q, flash) {
  const lt = (l) => Math.round(Number(l.quantity) * Number(l.unit_price) * (1 - Number(l.discount_percent || 0) / 100) * 100) / 100;
  const sub = Math.round(q.items.reduce((a, l) => a + lt(l), 0) * 100) / 100;
  const disc = Math.round(sub * Number(q.discount_percent || 0)) / 100;
  const hasDisc = q.items.some((l) => Number(l.discount_percent) > 0);
  const co = q.company || {};
  let state = '';
  if (flash) state = `<div class="msg good">${flash}</div>`;
  else if (q.status === 'accepte') state = `<div class="msg good"><b>Devis accepté</b>${q.decided_at ? ' le ' + esc(fmt(q.decided_at)) : ''}${q.accepted_by ? ' par ' + esc(q.accepted_by) : ''}. Merci pour votre confiance !</div>`;
  else if (q.status === 'refuse') state = `<div class="msg bad"><b>Devis refusé</b>${q.decided_at ? ' le ' + esc(fmt(q.decided_at)) : ''}.</div>`;
  else if (q.status === 'expire') state = `<div class="msg warn"><b>Ce devis n'est plus valable</b> (valable jusqu'au ${esc(fmt(q.valid_until))}). N'hésitez pas à nous demander un nouveau devis.</div>`;
  const canDecide = q.status === 'envoye' && !flash;
  $app.innerHTML = `
    <div class="band"><small>DEVIS</small><h1>${esc(q.number)}</h1><div class="d">${esc(co.name || '')} · établi le ${esc(fmt(q.issue_date))}${q.valid_until ? " · valable jusqu'au " + esc(fmt(q.valid_until)) : ''}</div></div>
    <div class="card">
      ${state}
      <div class="meta"><div>Pour<b>${esc(q.client_name || '')}</b></div><div>De<b>${esc(co.name || '')}</b>${esc([co.address, [co.postal_code, co.city].filter(Boolean).join(' ')].filter(Boolean).join(', '))}</div></div>
      <table><thead><tr><th>Description</th><th class="n">Qté</th><th class="n">Prix</th>${hasDisc ? '<th class="n">Remise</th>' : ''}<th class="n">Total</th></tr></thead><tbody>
        ${q.items.map((l) => `<tr><td>${l.type ? '<span style="color:#6b6b76">' + esc(l.type) + '</span><br>' : ''}${esc(l.description)}</td><td class="n">${esc(String(Number(l.quantity)).replace('.', ','))}</td><td class="n">${chf(l.unit_price)}</td>${hasDisc ? `<td class="n">${Number(l.discount_percent) > 0 ? esc(String(Number(l.discount_percent)).replace('.', ',')) + ' %' : ''}</td>` : ''}<td class="n">${chf(lt(l))}</td></tr>`).join('')}
      </tbody></table>
      <div class="tot">${Number(q.discount_percent) > 0 ? `<div>Sous-total : ${chf(sub)}</div><div>Remise ${esc(String(Number(q.discount_percent)).replace('.', ','))} % : − ${chf(disc)}</div>` : ''}<div class="grand"><span>Total</span><b>${chf(q.total)}</b></div></div>
      ${q.notes ? `<div class="notes">${esc(q.notes)}</div>` : ''}
      ${canDecide ? `<div class="act"><h2>Votre réponse</h2><label for="nm">Votre nom (facultatif)</label><input id="nm" maxlength="100" autocomplete="name" placeholder="Prénom Nom">
        <div class="btns"><button class="ok" id="acc">J'accepte ce devis</button><button class="no" id="ref">Je refuse</button></div>
        <div style="margin-top:10px;font-size:13px;color:#6b6b76">En acceptant, vous confirmez la commande aux conditions de ce devis.</div></div>` : ''}
    </div>
    <div class="foot">${esc(co.name || '')}${co.email ? ' · ' + esc(co.email) : ''}${co.phone ? ' · ' + esc(co.phone) : ''}</div>`;
  if (canDecide) {
    const go = async (action) => {
      const name = document.getElementById('nm').value.trim();
      if (action === 'refuse' && !confirm('Refuser ce devis ?')) return;
      document.querySelectorAll('button').forEach((b) => (b.disabled = true));
      const r = await call(action, name);
      if (r.status === 200 && r.data.ok) {
        const again = await call('get');
        render(again.data, action === 'accept' ? '<b>Merci !</b> Votre acceptation a bien été enregistrée. Nous revenons vers vous très vite.' : 'Votre refus a bien été enregistré. Merci de votre réponse.');
      } else {
        document.querySelectorAll('button').forEach((b) => (b.disabled = false));
        alert((r.data && r.data.error) || 'Une erreur est survenue. Réessayez dans un instant.');
        if (r.status === 409) location.reload();
      }
    };
    document.getElementById('acc').addEventListener('click', () => go('accept'));
    document.getElementById('ref').addEventListener('click', () => go('refuse'));
  }
}

(async () => {
  if (!/^[a-f0-9]{32}$/.test(token)) { $app.innerHTML = '<div class="msg bad"><b>Lien invalide.</b> Ouvrez le lien reçu dans le mail du devis.</div>'; return; }
  try {
    const r = await call('get');
    if (r.status === 200) render(r.data);
    else $app.innerHTML = `<div class="msg bad"><b>${esc((r.data && r.data.error) || 'Devis introuvable')}</b></div>`;
  } catch { $app.innerHTML = '<div class="msg bad"><b>Impossible de charger le devis.</b> Vérifiez votre connexion et réessayez.</div>'; }
})();
</script>
</body>
</html>
